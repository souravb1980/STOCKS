<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#334155" stroke-width="4" opacity="0.4" />
  
  <!-- Subtle Grid lines -->
  <line x1="80" y1="140" x2="432" y2="140" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />
  <line x1="80" y1="230" x2="432" y2="230" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />
  <line x1="80" y1="320" x2="432" y2="320" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />
  <line x1="80" y1="410" x2="432" y2="410" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />

  <!-- PAT Bars -->
  <rect x="110" y="340" width="36" height="70" rx="6" fill="#3b82f6" opacity="0.85" />
  <rect x="170" y="290" width="36" height="120" rx="6" fill="#3b82f6" opacity="0.85" />
  <rect x="230" y="250" width="36" height="160" rx="6" fill="#3b82f6" opacity="0.85" />
  <rect x="290" y="200" width="36" height="210" rx="6" fill="#3b82f6" opacity="0.85" />
  <rect x="350" y="150" width="40" height="260" rx="6" fill="#10b981" opacity="0.95" />

  <!-- Trend Curve to ATH -->
  <path d="M 90 380 Q 180 340 240 270 T 370 140" fill="none" stroke="url(#lineGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />

  <!-- ATH Marker Crown / Dot -->
  <circle cx="370" cy="140" r="14" fill="#10b981" stroke="#ffffff" stroke-width="4" filter="url(#glow)" />
  <path d="M 370 95 L 377 110 L 393 113 L 382 124 L 384 140 L 370 133 L 356 140 L 358 124 L 347 113 L 363 110 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />

  <!-- Rupee Symbol -->
  <text x="130" y="150" font-family="system-ui, sans-serif" font-weight="900" font-size="52" fill="#38bdf8" opacity="0.9">₹</text>

  <!-- ATH Badge -->
  <rect x="220" y="70" width="100" height="34" rx="17" fill="#10b981" opacity="0.95" />
  <text x="270" y="93" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">ATH ✔</text>
</svg>
